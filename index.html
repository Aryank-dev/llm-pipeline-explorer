<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Pipeline Explorer</title>

<!-- WHAT THIS DOES: loads Plotly, the library that draws the 3D chart -->
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

<style>
  /* WHAT THIS DOES: basic look of the page (light theme, centered column) */
  body { font-family: system-ui, sans-serif; background: #f5f6f8; color: #222; margin: 0; padding: 20px; }
  main { max-width: 1000px; margin: 0 auto; }
  h1 { margin-top: 0; }

  /* WHAT THIS DOES: each section is a white card */
  section { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-bottom: 24px; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  textarea, input[type=text] { width: 100%; box-sizing: border-box; font-family: inherit; font-size: 15px;
             padding: 8px; border: 1px solid #bbb; border-radius: 4px; }
  button { margin-top: 10px; padding: 8px 16px; font-size: 15px; background: #2563eb;
           color: #fff; border: none; border-radius: 4px; cursor: pointer; }

  /* WHAT THIS DOES: tables (vocabulary and closest pairs) */
  .table-box { max-height: 260px; overflow-y: auto; border: 1px solid #ddd; margin-top: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border-bottom: 1px solid #eee; padding: 5px 10px; text-align: left; }
  th { background: #f0f2f5; position: sticky; top: 0; }

  /* WHAT THIS DOES: the colored token "chips" */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { border-radius: 6px; padding: 4px 8px; text-align: center; border: 1px solid #0002; }
  .chip .text { font-family: monospace; font-size: 15px; }
  .chip .id { font-size: 11px; color: #555; }
  .note { font-style: italic; color: #555; margin-top: 8px; }
  .stats { margin-top: 10px; font-weight: 600; }
  .stats span { margin-right: 20px; }
  .message { margin-top: 10px; color: #92400e; }
</style>
</head>

<body>
<main>
  <h1>LLM Pipeline Explorer</h1>
  <p>How text becomes tokens, and then becomes points in 3D space.</p>

  <!-- WHAT THIS DOES: Section 1 - turn text into tokens and token IDs -->
  <section>
    <h2>1. Tokenizer</h2>

    <label for="corpus">Sentences to learn words from</label>
    <textarea id="corpus" rows="6">The cat sat on the mat.
The dog sat on the rug.
The cat saw the dog!
A dog and a cat can be friends.
Do you like the cat?
I don't like the rain, but I like the sun.</textarea>
    <button id="build-vocab-btn">Build vocabulary</button>

    <!-- WHAT THIS DOES: slider to keep only the top-N most frequent words -->
    <div id="vocab-slider-box" style="display:none;">
      <label for="vocab-slider">Words kept in vocabulary: <span id="vocab-slider-value"></span></label>
      <input type="range" id="vocab-slider" min="1" style="width:100%;">
      <p class="note">Drag left to shrink the vocabulary. Dropped words get split into smaller subword pieces — watch the token count grow.</p>
    </div>
    <div id="vocab-output"></div>

    <label for="encode-input">Encode a sentence</label>
    <textarea id="encode-input" rows="2">The dogs liked the sunny zebra.</textarea>
    <button id="tokenize-btn">Tokenize</button>
    <div id="token-output"></div>
  </section>

  <!-- WHAT THIS DOES: Section 2 - turn sentences into vectors and plot them in 3D -->
  <section>
    <h2>2. Embeddings in 3D</h2>

    <label for="sentences">Sentences (one per line)</label>
    <textarea id="sentences" rows="8">The cat sat on the mat.
A kitten rested on the rug.
The bat sat on the mat.
I love programming in Python.
Coding in Python is my passion.
Pythons are large snakes.
The stock market crashed today.
Share prices fell sharply.</textarea>

    <button id="embed-btn">Embed and plot</button>
    <div id="embed-status" class="message"></div>
    <div id="plot" style="height:520px;"></div>
    <div id="pairs-output"></div>

    <!-- WHAT THIS DOES: lets you type your own word and follow it through the whole pipeline -->
    <h3>Try your own word or sentence</h3>
    <input type="text" id="new-word" placeholder="e.g. puppy, or: My dog sleeps on the carpet.">
    <button id="add-word-btn">Tokenize, embed &amp; add to plot</button>
    <div id="new-word-output"></div>
  </section>
</main>

<script>
// =====================================================================
// PART 1: TOKENIZER
// =====================================================================

// WHAT THIS DOES: holds the vocabulary. Maps a word to its ID number.
let vocab = null;
let sortedWords = [];   // all words from the learning sentences, most frequent first
let wordCounts = {};    // word -> how many times it appears
let subwordPieces = []; // small pieces used to build unknown words, e.g. "##s", "##ing", "c", "##a"

// WHAT THIS DOES: common word endings. "##" means "this piece joins the piece before it".
const COMMON_ENDINGS = ["##s", "##es", "##ed", "##ing", "##er", "##ly", "##y"];

// WHAT THIS DOES: turns raw text into a list of word tokens (rules 1-3)
function splitIntoWords(text) {
  let t = text.toLowerCase();                  // 1. lowercase
  t = t.replace(/([.,!?'])/g, " $1 ");         // 2. spaces around punctuation
  return t.split(/\s+/).filter(w => w !== ""); // 3. split on whitespace
}

// WHAT THIS DOES: builds the vocabulary from the learning sentences (rules 4-5)
function buildVocabulary() {
  const words = splitIntoWords(document.getElementById("corpus").value);

  // 4. count how often each word appears
  wordCounts = {};
  for (const w of words) {
    wordCounts[w] = (wordCounts[w] || 0) + 1;
  }
  // sort words: most frequent first
  sortedWords = Object.keys(wordCounts).sort((a, b) => wordCounts[b] - wordCounts[a]);

  // subword pieces: common endings + every letter seen (as a start piece "c" and a joining piece "##c")
  const letters = [...new Set(words.join("").replace(/[^a-z]/g, ""))].sort();
  subwordPieces = [...COMMON_ENDINGS, ...letters, ...letters.map(ch => "##" + ch)];

  // set up the slider: starts at "keep every word"
  const slider = document.getElementById("vocab-slider");
  slider.max = sortedWords.length;
  slider.value = sortedWords.length;
  document.getElementById("vocab-slider-box").style.display = "block";

  applyVocabSize(sortedWords.length);
}

// WHAT THIS DOES: keeps only the top N words, assigns IDs, and redraws the table
function applyVocabSize(n) {
  const kept = sortedWords.slice(0, n);
  document.getElementById("vocab-slider-value").textContent = `${n} of ${sortedWords.length}`;

  // 5. assign IDs: 0 is [UNK], then whole words, then subword pieces
  vocab = { "[UNK]": 0 };
  let rows = "<tr><td>0</td><td>[UNK]</td><td>-</td></tr>";
  kept.forEach(w => {
    vocab[w] = Object.keys(vocab).length;
    rows += `<tr><td>${vocab[w]}</td><td>${escapeHtml(w)}</td><td>${wordCounts[w]}</td></tr>`;
  });
  subwordPieces.forEach(p => {
    if (p in vocab) return;            // a letter like "a" may already be a whole word
    vocab[p] = Object.keys(vocab).length;
    rows += `<tr><td>${vocab[p]}</td><td>${escapeHtml(p)}</td><td>subword</td></tr>`;
  });

  // show the table
  document.getElementById("vocab-output").innerHTML =
    `<p class="stats">Vocabulary size: ${Object.keys(vocab).length} tokens
       (${kept.length} words + subword pieces + [UNK])</p>
     <div class="table-box"><table>
       <tr><th>ID</th><th>Token</th><th>Frequency</th></tr>${rows}
     </table></div>`;
}

// WHAT THIS DOES: splits one unknown word into the LONGEST known pieces (subword tokenization).
// Example: "dogs" -> "dog" + "##s",  "sunny" -> "sun" + "##n" + "##y"
// If some part can't be matched at all, the whole word becomes [UNK].
function splitIntoSubwords(word) {
  const pieces = [];
  let start = 0;
  while (start < word.length) {
    // try the longest piece first, then shorter and shorter
    let found = null;
    for (let end = word.length; end > start; end--) {
      let piece = word.slice(start, end);
      if (start > 0) piece = "##" + piece;   // pieces after the first one get "##"
      if (piece in vocab) { found = piece; break; }
    }
    if (found === null) return [{ text: "[UNK]", id: 0, unknown: true }];
    pieces.push({ text: found, id: vocab[found], unknown: true });
    start += found.replace("##", "").length;
  }
  return pieces;
}

// WHAT THIS DOES: turns a sentence into a list of {text, id} tokens
function encode(text) {
  const tokens = [];
  for (const word of splitIntoWords(text)) {
    if (word in vocab) {
      tokens.push({ text: word, id: vocab[word] });   // known word: one token
    } else {
      tokens.push(...splitIntoSubwords(word));        // unknown word: subword pieces
    }
  }
  return tokens;
}

// WHAT THIS DOES: picks a color from the ID, so a token always gets the same color
function colorForId(id) {
  const hue = (id * 47) % 360;
  return `hsl(${hue}, 70%, 85%)`;
}

// WHAT THIS DOES: runs when you click "Tokenize" and draws the chips + stats
function tokenizeSentence() {
  if (vocab === null) buildVocabulary();   // build the vocab first if needed
  const text = document.getElementById("encode-input").value;
  const tokens = encode(text);
  const chips = renderChips(tokens);

  const hasUnknown = tokens.some(t => t.unknown);
  const charCount = text.length;
  const ratio = tokens.length ? (charCount / tokens.length).toFixed(2) : "0";

  document.getElementById("token-output").innerHTML =
    `${chips}
     ${hasUnknown ? '<p class="note">words not in the vocabulary are split into the longest known pieces (subwords). A word with no matching pieces becomes [UNK].</p>' : ""}
     <p class="stats">
       <span>Characters: ${charCount}</span>
       <span>Tokens: ${tokens.length}</span>
       <span>Characters per token: ${ratio}</span>
     </p>`;
}

// WHAT THIS DOES: builds the HTML for a row of colored token chips
function renderChips(tokens) {
  let chips = "";
  for (const t of tokens) {
    chips += `<div class="chip" style="background:${colorForId(t.id)}">
                <div class="text">${escapeHtml(t.text)}</div>
                <div class="id">${t.id}</div>
              </div>`;
  }
  return `<div class="chips">${chips}</div>`;
}

// WHAT THIS DOES: makes text safe to put inside HTML
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// =====================================================================
// PART 2: EMBEDDINGS
// =====================================================================

// WHAT THIS DOES: a simple string hash -> a whole number
function hashString(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = (h * 31 + s.charCodeAt(i)) >>> 0;  // >>> 0 keeps it a positive 32-bit number
  }
  return h;
}

// WHAT THIS DOES: scales a vector so its length is 1 (L2-normalize)
function normalize(v) {
  const len = Math.sqrt(v.reduce((sum, x) => sum + x * x, 0)) || 1;
  return v.map(x => x / len);
}

// WHAT THIS DOES: spelling-based vector = counts of 3-letter chunks in 64 buckets
function spellingVector(sentence) {
  const s = sentence.toLowerCase();
  const v = new Array(64).fill(0);
  for (let i = 0; i + 3 <= s.length; i++) {
    const trigram = s.slice(i, i + 3);       // e.g. "the", "he ", "e c"...
    v[hashString(trigram) % 64] += 1;
  }
  return normalize(v);
}

// WHAT THIS DOES: dot product of two vectors (multiply matching numbers, add up)
function dot(a, b) {
  let sum = 0;
  for (let i = 0; i < a.length; i++) sum += a[i] * b[i];
  return sum;
}

// WHAT THIS DOES: similarity = how much two vectors point the same way (1 = same, 0 = nothing alike)
function similarity(a, b) {
  return dot(a, b) / (Math.sqrt(dot(a, a)) * Math.sqrt(dot(b, b)) || 1);
}

// WHAT THIS DOES: PCA - squashes many-dimensional vectors down to 3 dimensions
function pcaTo3D(vectors) {
  const n = vectors.length, d = vectors[0].length;

  // Step 1: subtract the mean of each dimension (center the data)
  const mean = new Array(d).fill(0);
  for (const v of vectors) for (let j = 0; j < d; j++) mean[j] += v[j] / n;
  const X = vectors.map(v => v.map((x, j) => x - mean[j]));

  // Step 2: covariance matrix C (d x d): how dimensions vary together
  const C = [];
  for (let a = 0; a < d; a++) {
    C.push(new Array(d).fill(0));
    for (let b = 0; b < d; b++) {
      for (let i = 0; i < n; i++) C[a][b] += X[i][a] * X[i][b];
      C[a][b] /= (n - 1);
    }
  }

  // Step 3: find the top 3 directions using power iteration with deflation
  const components = [];
  for (let k = 0; k < 3; k++) {
    // start from a fixed "random-looking" vector
    let v = normalize(Array.from({ length: d }, (_, j) => Math.sin(j + 1 + k)));
    for (let iter = 0; iter < 50; iter++) {
      v = normalize(C.map(row => dot(row, v)));   // v = C * v, then rescale
    }
    const lambda = dot(v, C.map(row => dot(row, v)));  // how much spread along v
    components.push(v);
    // deflation: remove this direction from C so the next loop finds a new one
    for (let a = 0; a < d; a++)
      for (let b = 0; b < d; b++) C[a][b] -= lambda * v[a] * v[b];
  }

  // Step 4: project each sentence onto the 3 directions -> (x, y, z)
  return X.map(x => components.map(c => dot(x, c)));
}

// WHAT THIS DOES: draws the 3D scatter plot with Plotly
function drawPlot(points, sentences) {
  const trace = {
    type: "scatter3d",
    mode: "markers+text",
    x: points.map(p => p[0]),
    y: points.map(p => p[1]),
    z: points.map(p => p[2]),
    text: sentences.map(s => s.length > 18 ? s.slice(0, 18) + "…" : s),
    hovertext: sentences,
    hoverinfo: "text",
    textposition: "top center",
    // the user's own word is drawn bigger and orange so it stands out
    marker: {
      size: sentences.map(s => s === userText ? 11 : 6),
      color: sentences.map(s => s === userText ? "#f97316" : "#2563eb")
    }
  };
  const layout = {
    margin: { l: 0, r: 0, t: 0, b: 0 },
    scene: { xaxis: { title: "PC1" }, yaxis: { title: "PC2" }, zaxis: { title: "PC3" } }
  };
  Plotly.newPlot("plot", [trace], layout);
}

// WHAT THIS DOES: table of the 5 most similar sentence pairs (on FULL vectors)
function showClosestPairs(vectors, sentences) {
  const pairs = [];
  for (let i = 0; i < vectors.length; i++)
    for (let j = i + 1; j < vectors.length; j++)
      pairs.push({ a: sentences[i], b: sentences[j], score: similarity(vectors[i], vectors[j]) });
  pairs.sort((p, q) => q.score - p.score);

  let rows = "";
  for (const p of pairs.slice(0, 5)) {
    rows += `<tr><td>${escapeHtml(p.a)}</td><td>${escapeHtml(p.b)}</td><td>${p.score.toFixed(3)}</td></tr>`;
  }
  document.getElementById("pairs-output").innerHTML =
    `<h3>Closest pairs</h3>
     <table><tr><th>Sentence A</th><th>Sentence B</th><th>Similarity</th></tr>${rows}</table>`;
}

// WHAT THIS DOES: runs when you click "Embed and plot" - the whole pipeline
async function embedAndPlot() {
  const status = document.getElementById("embed-status");
  status.textContent = "";
  const sentences = document.getElementById("sentences").value
    .split("\n").map(s => s.trim()).filter(s => s !== "");

  if (sentences.length < 4) {
    status.textContent = "Please enter at least 4 sentences.";
    return;
  }

  const vectors = sentences.map(spellingVector);

  drawPlot(pcaTo3D(vectors), sentences);
  showClosestPairs(vectors, sentences);
  if (sentences.includes(userText)) showUserWordDetails(vectors, sentences);
}

// =====================================================================
// PART 3: YOUR OWN WORD -> tokens -> vector -> point in the plot
// =====================================================================

// WHAT THIS DOES: remembers which text the user added, so we can highlight it
let userText = null;

// WHAT THIS DOES: runs when you click "Tokenize, embed & add to plot"
async function addUserWord() {
  const text = document.getElementById("new-word").value.trim();
  if (text === "") return;

  // Step 1: tokenize it with the vocabulary from Section 1
  if (vocab === null) buildVocabulary();
  document.getElementById("new-word-output").innerHTML =
    `<p class="stats">Step 1 — tokens and IDs:</p>${renderChips(encode(text))}
     <div id="new-word-vector"></div>`;

  // Step 2 + 3: add it to the sentence list, then embed and plot everything again
  const box = document.getElementById("sentences");
  const lines = box.value.split("\n").map(s => s.trim());
  if (!lines.includes(text)) box.value = box.value.trimEnd() + "\n" + text;
  userText = text;
  await embedAndPlot();
}

// WHAT THIS DOES: shows the user's vector and the sentences closest to it
function showUserWordDetails(vectors, sentences) {
  const me = sentences.indexOf(userText);
  const v = vectors[me];

  // nearest neighbours by similarity on the full vectors
  const others = sentences
    .map((s, i) => ({ s, score: similarity(v, vectors[i]) }))
    .filter((o, i) => i !== me)
    .sort((a, b) => b.score - a.score)
    .slice(0, 3);

  let rows = "";
  for (const o of others) rows += `<tr><td>${escapeHtml(o.s)}</td><td>${o.score.toFixed(3)}</td></tr>`;

  document.getElementById("new-word-vector").innerHTML =
    `<p class="stats">Step 2 — vector (first 8 of ${v.length} numbers):</p>
     <code>[${v.slice(0, 8).map(x => x.toFixed(3)).join(", ")}, …]</code>
     <p class="stats">Step 3 — it is the <span style="color:#f97316">orange point</span> in the plot. Closest sentences:</p>
     <table><tr><th>Sentence</th><th>Similarity</th></tr>${rows}</table>`;
}

// WHAT THIS DOES: connects the buttons to the functions above
document.getElementById("build-vocab-btn").addEventListener("click", buildVocabulary);
document.getElementById("tokenize-btn").addEventListener("click", tokenizeSentence);

// WHAT THIS DOES: when the slider moves, shrink the vocab and re-tokenize so you see the effect live
document.getElementById("vocab-slider").addEventListener("input", function () {
  applyVocabSize(Number(this.value));
  if (document.getElementById("token-output").innerHTML !== "") tokenizeSentence();
});
document.getElementById("embed-btn").addEventListener("click", embedAndPlot);
document.getElementById("add-word-btn").addEventListener("click", addUserWord);
document.getElementById("new-word").addEventListener("keydown", e => { if (e.key === "Enter") addUserWord(); });
</script>
</body>
</html>
